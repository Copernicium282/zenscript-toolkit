id = "zenscript-toolkit"
name = "ZenScript Toolkit"
version = "0.1.0"
schema_version = 1
authors = ["Copernicium282 <Copernicium282@users.noreply.github.com>"]
description = "ZenScript and Minecraft .lang language support for Zed, with optional ZSBC bracket-handler completions."
repository = "https://github.com/Copernicium282/zenscript-toolkit"
license = "MIT"

[grammars.zenscript]
repository = "https://github.com/Copernicium282/tree-sitter-zenscript"
rev = "main"

[grammars.properties]
repository = "https://github.com/tree-sitter-grammars/tree-sitter-properties"
commit = "6310671b24d4e04b803577b1c675d765cbd5773b"

[language_servers.zsbc]
name = "ZenScript Bracket Completion"
languages = ["ZenScript"]
