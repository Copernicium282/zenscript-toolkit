[workspace]
members = [
    ".",
    "lsp-server",
]

[package]
name = "zenscript-toolkit"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
zed_extension_api = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
