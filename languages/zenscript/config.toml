name = "ZenScript"
grammar = "zenscript"
path_suffixes = ["zs", "zsrc"]
line_comments = ["//"]
block_comment = ["/*", "*/"]
autoclose_before = ";:.,=}])>\" "

[[brackets]]
start = "{"
end = "}"
close = true
newline = true

[[brackets]]
start = "["
end = "]"
close = true
newline = true

[[brackets]]
start = "("
end = ")"
close = true
newline = true

[[brackets]]
start = "<"
end = ">"
close = false
newline = true
not_in = ["string", "comment"]

[[brackets]]
start = "\""
end = "\""
close = true
newline = false
not_in = ["string", "comment"]

[[brackets]]
start = "'"
end = "'"
close = true
newline = false
not_in = ["string", "comment"]

[[brackets]]
start = "/*"
end = " */"
close = true
newline = false
not_in = ["string", "comment"]
