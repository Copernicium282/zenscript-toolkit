[package]
name = "zsbc-lsp"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "zsbc-lsp"
path = "src/main.rs"

[dependencies]
lsp-server = "0.7"
lsp-types = "0.95"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
